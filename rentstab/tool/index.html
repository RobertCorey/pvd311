<title>Providence Rent Cap Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/*MAPLIBRE_CSS*/
/* Layout: the city fills the screen; one side panel carries the numbers, the search, and whatever you picked.
   Palette: FixMyPVD "Ember & Harbor" — harbor ink on paper; ember is a home the cap would reach. Light only, like FixMyPVD. */
:root {
  --paper: #F7F1E6;
  --land: #F4EFE6;
  --surface: #FFFCF7;
  --ink: #16213A;
  --muted: #5A6275;
  --line: #E3DACB;
  --ember-text: #BD3F12;
  --river: #1D5C99;
  /* Map marks. Three hues for the rental outcomes (validated all-pairs: CVD ΔE ≥ 9.2, normal ≥ 24 on --land);
     owners and "can't tell" are neutrals, separated by lightness, so they never compete with the hues. */
  --controlled: #EB6834;
  --market: #2A78D6;
  --subsidized: #1BAF7A;
  --owned: #C7BFB1;
  --unclear: #827E76;
  --nohomes: #E6DFD3;
  --font-display: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14.5px/1.5 var(--font-body); margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 14px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: 100%; }
.mapwrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--land); }
.panel { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; padding-block: 18px 28px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 58vh auto; height: auto; }
  .mapwrap { height: 58vh; }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .desk { display: none !important; }
}

.big { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; color: var(--ember-text); font-variant-numeric: tabular-nums; }
.headline { display: grid; gap: 6px; }
.stack { display: flex; height: 18px; border-radius: 4px; overflow: hidden; background: var(--line); }
.stack i { display: block; height: 100%; }
.mini { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: var(--line); }
.mini i { display: block; height: 100%; }
.key { display: grid; gap: 5px; font-size: 13px; }
.key div { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.key b { font-variant-numeric: tabular-nums; font-weight: 600; }
.sw { width: 10px; height: 10px; border-radius: 50%; transform: translateY(1px); }
.sw.owned { background: var(--owned); } .sw.controlled { background: var(--controlled); } .sw.market { background: var(--market); } .sw.subsidized { background: var(--subsidized); } .sw.unclear { background: var(--unclear); }
.sw.light { opacity: .45; }
.sw.sq { border-radius: 2px; }
.sw.nohomes { background: var(--nohomes); border: 1px solid var(--line); }
.note { font-size: 12.5px; color: var(--muted); }

.searchbox { position: relative; }
.searchbox input { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-height: 40px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--river); outline-offset: 2px; }
#sugg { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); position: absolute; left: 0; right: 0; z-index: 10; max-height: 300px; overflow: auto; box-shadow: 0 6px 18px rgba(22,33,58,.1); }
#sugg:empty { display: none; }
#sugg li { padding: 8px 10px; cursor: pointer; border-top: 1px solid var(--line); font-size: 14px; }
#sugg li:first-child { border-top: 0; }
#sugg li:hover, #sugg li[aria-selected="true"] { background: var(--paper); }
#sugg small { color: var(--muted); }

.card { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.back { font: inherit; font-size: 13px; background: none; border: 0; color: var(--river); cursor: pointer; padding: 0; justify-self: start; }
.pill { display: inline-block; font-weight: 600; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; }
.pill.controlled { background: var(--controlled); color: var(--ink); }
.pill.market { background: var(--market); color: var(--surface); }
.pill.subsidized { background: var(--subsidized); color: var(--surface); }
.pill.owned { background: var(--owned); color: var(--ink); }
.pill.unclear { background: var(--unclear); color: var(--surface); }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.card details { font-size: 12.5px; color: var(--muted); }
.card details ul { margin-top: 6px; }

.hoods { display: grid; gap: 2px; }
.hoods button { font: inherit; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px; cursor: pointer; display: grid; gap: 5px; color: var(--ink); }
.hoods button:hover { background: var(--paper); }
.hoods .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.hoods .top span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sortbar { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; align-items: center; }
.sortbar button { font: inherit; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; color: var(--ink); }
.sortbar button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
footer { font-size: 11.5px; color: var(--muted); display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }

.maplegend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 12px; display: grid; gap: 4px; pointer-events: none; }
.maplegend .row { display: flex; gap: 6px; align-items: center; }
.maplibregl-ctrl-group { border-radius: 8px !important; box-shadow: none !important; border: 1px solid var(--line); }
.maplibregl-canvas:focus { outline: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; background: var(--land); z-index: 5; }
</style>

<div class="app">
  <div class="mapwrap">
    <div id="map" role="img" aria-label="Map of Providence with one dot per home, colored by whether the April 2026 rent cap would cover it"></div>
    <div class="loading" id="loading">Loading 69,000 homes…</div>
    <div class="maplegend desk" id="maplegend"></div>
  </div>
  <aside class="panel" id="panel" aria-label="Details">
    <header style="display:grid;gap:6px">
      <span class="eyebrow">Providence · April 2026 rent stabilization (vetoed)</span>
      <h1>Who the 4% rent cap would likely have covered</h1>
    </header>
    <div class="searchbox">
      <label for="q" class="eyebrow">Find an address</label>
      <input id="q" type="search" placeholder="e.g. 135 Brook St" autocomplete="off" role="combobox" aria-controls="sugg" aria-expanded="false">
      <ul id="sugg" role="listbox"></ul>
    </div>
    <div id="body"></div>
    <footer id="footer"></footer>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="app.js"></script>
