<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F1E6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1222" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts: non-blocking (print media until loaded), display=swap keeps text visible. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Inter:wght@400;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Inter:wght@400;600&display=swap" /></noscript>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FixMyPVD" />
    <meta name="description" content="Report a Providence street problem in one photo — we file it with the city's 311 for you." />
    <meta property="og:title" content="FixMyPVD" />
    <meta property="og:description" content="Report a Providence street problem in one photo — we file it with the city's 311 for you." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pvdsnow.org/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>FixMyPVD</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Sentry error monitoring (same project as the legacy app; lazy loader, no PII) -->
    <script>
      window.sentryOnLoad = function () { Sentry.init({ release: 'snappvd@app', sendDefaultPii: false, tracesSampleRate: 0 }); };
    </script>
    <script src="https://js.sentry-cdn.com/04195069c1daa8e3d2057b6405e37a21.min.js" crossorigin="anonymous" data-lazy="no" async></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
