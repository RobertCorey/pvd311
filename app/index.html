<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Canonical host: the old pvdsnow.org domain forwards to fixmypvd.org (Firebase Hosting has no host-based redirects).
      if (/(^|\.)pvdsnow\.org$/.test(location.hostname)) location.replace('https://fixmypvd.org' + location.pathname + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F1E6" />
    <meta name="color-scheme" content="light" />
    <!-- Fonts: non-blocking (print media until loaded), display=swap keeps text visible. -->
    <!-- Fonts are self-hosted (src/fonts.css); preload the two faces on the first paint (display + body 400). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-800-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400-latin.woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FixMyPVD" />
    <meta name="description" content="Report a Providence street problem in one photo — we file it with the city's 311 for you." />
    <meta property="og:title" content="FixMyPVD" />
    <meta property="og:description" content="Report a Providence street problem in one photo — we file it with the city's 311 for you." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://fixmypvd.org/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://fixmypvd.org/" />
    <title>FixMyPVD</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Sentry error monitoring (loader, no PII). Not loaded on localhost: the Playwright suite runs the
         production build under `vite preview` on localhost:4173, and its errors reached the production
         project as real issues (JAVASCRIPT-9, 2026-10-16). A build-mode flag can't tell preview from prod.
         Lazy (2026-10-28, page speed): the 3 KB loader buffers errors and unhandled rejections and fetches the
         SDK bundle only on the first one (or a Sentry.capture* call), then runs sentryOnLoad's init and replays
         the buffer. It used to be data-lazy="no", which fetched and ran the whole SDK on every page. Turning on
         Performance or Replay in the project's Loader Script settings makes the loader eager again. -->
    <script>
      (function () {
        var h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h === '::1' || /\.localhost$/.test(h)) return;
        window.sentryOnLoad = function () { Sentry.init({ release: 'fixmypvd@app', sendDefaultPii: false, tracesSampleRate: 0 }); };
        var s = document.createElement('script');
        s.src = 'https://js.sentry-cdn.com/04195069c1daa8e3d2057b6405e37a21.min.js';
        s.crossOrigin = 'anonymous';
        s.async = true;
        document.body.appendChild(s);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
