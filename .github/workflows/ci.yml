name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  typecheck-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: worker typecheck
        run: cd worker && npm ci && npm run typecheck
