name = "pvd311-worker"
main = "src/index.ts"
# Custom domain api.fixmypvd.org is attached account-side (created 2026-08-22); not declared here because the deploy token lacks the Workers Routes scope.
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Browser Run (headless Chromium) — requires Workers Paid for meaningful quota.
browser = { binding = "BROWSER" }

# Cron triggers:
#   "* * * * *"    submit tick (reaper + one submission, HITL-gated)
#   "*/30 * * * *" status watcher (My Requests diff)
#   "0 11 * * *"   daily digest + selector canary
#                  11:00 UTC = 06:00 EST (winter) / 07:00 EDT (summer). Crons are UTC-only; for a steady
#                  06:00 local you'd need to swap between "0 11" (winter) and "0 10" (summer). ~1h drift is fine here.
[triggers]
crons = ["* * * * *", "*/30 * * * *", "0 11 * * *"]

[vars]
PORTAL_BASE_URL = "https://311.providenceri.gov"
APP_NAME = "PVD311 app"
HITL_MODE = "ramp"                 # per-account trust ramp (first ACCOUNT_TRUST_N reports per account reviewed, then auto); "review" = panic switch
ACCOUNT_TRUST_N = "3"
ADMIN_EMAILS = "robertbcorey@gmail.com"
RECONCILE_ENABLED = "1"          # watcher: adopt/stranded/missing pass against My Requests (docs/engine-sync.md rule 7)
DRIFT_CANARY_ENABLED = "1"       # nightly Step-3 golden diff on the designated canary draft (meta/canaryDraft); first live dump mints the baseline
AUTH_FROM = "FixMyPVD <updates@fixmypvd.org>"   # sign-in link sender (Resend, domain verified 2026-08-22)
FIREBASE_PROJECT_ID = "pvd-snow-report"
STORAGE_BUCKET = "pvd-snow-report.firebasestorage.app"
NOTIFY_EMAIL = "rob@fixmypvd.org"
NOTIFY_FROM = "FixMyPVD <updates@fixmypvd.org>"
REPORTER_EMAIL_ENABLED = "true"
APP_BASE_URL = "https://fixmypvd.org"
BLOCKED_ADDRESSES = "congdon st,congdon street"
# Where signed HITL approve/reject email links point. Update to the custom domain at launch.
HITL_BASE_URL = "https://api.fixmypvd.org"
# Legacy per-category ramp threshold (only used for ownerless rows now). Default 3.
# TRUST_RAMP_N = "3"

# Cron ticks can spend a while in Browser Run. cpu_ms is honored on Workers Paid; harmless comment otherwise.
[limits]
cpu_ms = 300000

# ── Secrets (set with `wrangler secret put <NAME>` or via CI) ──────────────────────────
#   PORTAL_EMAIL              portal login
#   PORTAL_PASSWORD           portal login
#   CANARY_TOKEN              x-canary-token for /canary and /api/status
#   FIREBASE_SERVICE_ACCOUNT  service-account JSON, as a single-line string
#   ANTHROPIC_API_KEY         agent scout (unmapped Step-3 fields)
#   RESEND_API_KEY            outbound email (HITL + alerts + digest)
#   HITL_SECRET               HMAC secret for signed approve/reject links
